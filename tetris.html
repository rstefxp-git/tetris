<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tetris</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}
html,body{height:100%;margin:0;background:#0b0e14;color:#cfd6e4;font-family:system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#bar{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;font-size:15px;gap:10px}
#bar b{color:#fff;font-size:18px;margin-left:4px}
#bar canvas{width:44px;height:44px}
#pz{background:none;border:1px solid #2a3550;color:#cfd6e4;border-radius:8px;font-size:16px;padding:6px 12px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#board{border:1px solid #2a3550;background:#0f1522}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:rgba(11,14,20,.85);font-size:26px;line-height:1.5}
#pad{height:24dvh;height:24vh;display:flex;gap:10px;padding:10px 12px 12px}
#rot{display:flex;flex-direction:column;justify-content:center;gap:12px}
#mv{flex:1;display:flex;gap:10px}
button{font:inherit;border:0;background:#1c2540;color:#fff;font-size:34px}
button:active{background:#34436b}
.r{width:min(20vw,10dvh);width:min(20vw,10vh);height:min(20vw,10dvh);height:min(20vw,10vh);border-radius:50%}
#mv button{flex:1;border-radius:18px;font-size:48px}
</style>
</head>
<body>
<div id="app">
 <div id="bar">
  <span>Score<b id="sc">0</b></span><span>Niv.<b id="lv">1</b></span>
  <canvas id="next" width="44" height="44"></canvas>
  <button id="pz">❚❚</button>
 </div>
 <div id="stage"><canvas id="board"></canvas><div id="msg"></div></div>
 <div id="pad">
  <div id="rot"><button class="r" id="bb">↺</button><button class="r" id="ba">↻</button></div>
  <div id="mv"><button id="bl">◀</button><button id="br">▶</button></div>
 </div>
</div>
<script>
const C=10,R=20,COL=['','#00e5ff','#2979ff','#ff9100','#ffea00','#00e676','#d500f9','#ff1744'];
const SH=[[[1,1,1,1]],[[2,0,0],[2,2,2]],[[0,0,3],[3,3,3]],[[4,4],[4,4]],[[0,5,5],[5,5,0]],[[0,6,0],[6,6,6]],[[7,7,0],[0,7,7]]];
const cv=document.getElementById('board'),cx=cv.getContext('2d'),nc=document.getElementById('next').getContext('2d');
let S=24,grid,p,nx,bag=[],score,lines,level,over,paused,last,acc;
function size(){S=Math.max(8,Math.floor(Math.min((stage.clientHeight-4)/R,(stage.clientWidth-4)/C)));cv.width=C*S;cv.height=R*S;draw()}
function rnd(){if(!bag.length){bag=[0,1,2,3,4,5,6];for(let i=6;i>0;i--){const j=Math.random()*(i+1)|0;[bag[i],bag[j]]=[bag[j],bag[i]]}}return SH[bag.pop()].map(r=>r.slice())}
function rot(m){return m[0].map((_,i)=>m.map(r=>r[i]).reverse())}
function hit(m,x,y){for(let j=0;j<m.length;j++)for(let i=0;i<m[j].length;i++)if(m[j][i]){const a=x+i,b=y+j;if(a<0||a>=C||b>=R||(b>=0&&grid[b][a]))return true}return false}
function spawn(){p={m:nx||rnd(),x:0,y:0};nx=rnd();p.x=(C-p.m[0].length)/2|0;if(hit(p.m,p.x,p.y)){over=true;show('Perdu<br>'+score+'<br>Toucher pour rejouer')}drawNext()}
function reset(){grid=Array.from({length:R},()=>Array(C).fill(0));score=lines=0;level=1;over=paused=false;acc=0;nx=null;bag=[];spawn();hide();upd();draw()}
function mv(dx){if(over||paused)return;if(!hit(p.m,p.x+dx,p.y)){p.x+=dx;draw()}}
function turn(cw){if(over||paused)return;let m=rot(p.m);if(!cw)m=rot(rot(m));for(const k of[0,-1,1,-2,2])if(!hit(m,p.x+k,p.y)){p.m=m;p.x+=k;draw();return}}
function drop(){if(over||paused)return false;if(!hit(p.m,p.x,p.y+1)){p.y++;draw();return true}lock();return false}
function hard(){if(over||paused)return;let n=0;while(!hit(p.m,p.x,p.y+1)){p.y++;n++}score+=n*2;lock()}
function lock(){p.m.forEach((r,j)=>r.forEach((v,i)=>{if(v&&p.y+j>=0)grid[p.y+j][p.x+i]=v}));let n=0;
 for(let y=R-1;y>=0;y--)if(grid[y].every(v=>v)){grid.splice(y,1);grid.unshift(Array(C).fill(0));n++;y++}
 if(n){score+=[0,100,300,500,800][n]*level;lines+=n;level=1+(lines/10|0)}
 spawn();upd();draw()}
function upd(){sc.textContent=score;lv.textContent=level}
function cell(c,x,y,s,col){c.fillStyle=col;c.fillRect(x*s+.5,y*s+.5,s-1,s-1)}
function draw(){if(!grid)return;cx.clearRect(0,0,cv.width,cv.height);
 grid.forEach((r,y)=>r.forEach((v,x)=>v&&cell(cx,x,y,S,COL[v])));
 if(p&&!over){let g=p.y;while(!hit(p.m,p.x,g+1))g++;
  cx.globalAlpha=.2;p.m.forEach((r,j)=>r.forEach((v,i)=>v&&cell(cx,p.x+i,g+j,S,COL[v])));cx.globalAlpha=1;
  p.m.forEach((r,j)=>r.forEach((v,i)=>v&&cell(cx,p.x+i,p.y+j,S,COL[v])))}}
function drawNext(){nc.clearRect(0,0,44,44);const s=10,w=nx[0].length,h=nx.length,ox=(44-w*s)/2/s,oy=(44-h*s)/2/s;
 nx.forEach((r,j)=>r.forEach((v,i)=>v&&cell(nc,ox+i,oy+j,s,COL[v])))}
function show(t){msg.innerHTML=t;msg.style.display='flex'}
function hide(){msg.style.display='none'}
function pause(){if(over){reset();return}paused=!paused;paused?show('Pause'):hide()}
msg.onclick=pause;pz.onclick=pause;
function tap(el,f){el.addEventListener('pointerdown',e=>{e.preventDefault();f()})}
function rep(el,f){let t,i;el.addEventListener('pointerdown',e=>{e.preventDefault();f();t=setTimeout(()=>{i=setInterval(f,70)},200)});
 const st=()=>{clearTimeout(t);clearInterval(i)};['pointerup','pointerleave','pointercancel'].forEach(n=>el.addEventListener(n,st))}
rep(bl,()=>mv(-1));rep(br,()=>mv(1));tap(ba,()=>turn(true));tap(bb,()=>turn(false));
addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowLeft')mv(-1);else if(k==='ArrowRight')mv(1);else if(k==='ArrowDown'){if(drop())score++,upd()}else if(k==='ArrowUp'||k==='x')turn(true);else if(k==='z')turn(false);else if(k===' ')hard();else if(k==='p')pause();else return;e.preventDefault()});
let sy,st0,dd;
const app=document.getElementById('app');
app.addEventListener('touchstart',e=>{if(e.target.closest('button'))return sy=null;sy=e.touches[0].clientY;st0=Date.now();dd=0});
app.addEventListener('touchmove',e=>{if(sy==null)return;e.preventDefault();const y=e.touches[0].clientY;while(y-sy>S){sy+=S;dd+=S;if(drop())score++}upd()},{passive:false});
app.addEventListener('touchend',e=>{if(sy==null)return;const t=e.changedTouches[0];if(dd+(t.clientY-sy)>S*7&&Date.now()-st0<300)hard();sy=null});
function loop(t){requestAnimationFrame(loop);if(over||paused||!grid){last=t;return}
 acc+=t-(last||t);last=t;const iv=Math.max(80,800-(level-1)*70);
 if(acc>=iv){acc=0;drop()}}
addEventListener('resize',size);size();reset();requestAnimationFrame(()=>{size();draw()});requestAnimationFrame(loop);
</script>
</body>
</html>
